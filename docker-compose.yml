# NexusML Pipeline Platform - Docker Compose
# Production-ready orchestration for the complete stack

version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexusml-postgres
    environment:
      POSTGRES_USER: nexusml
      POSTGRES_PASSWORD: nexusml_secure_password
      POSTGRES_DB: nexusml_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusml"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusml-network

  # ─── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexusml-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusml-network

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nexusml-backend
    environment:
      DATABASE_URL: postgresql://nexusml:nexusml_secure_password@postgres:5432/nexusml_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/backend/models:ro
    networks:
      - nexusml-network
    restart: unless-stopped

  # ─── Nginx Reverse Proxy (Optional) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexusml-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - nexusml-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nexusml-network:
    driver: bridge
